name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../RLC.apk

      - name: Package Chrome extension
        run: zip -j rlc-extension.zip manifest.json content.js

      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest RLC.apk rlc-extension.zip \
            --title "Latest build" \
            --notes "Build #${{ github.run_number }} from ${{ github.sha }}"
